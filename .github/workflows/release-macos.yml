name: Release macOS (signed & notarized)

# macOS 发布流水线（P1，2026-10-12）：
# 构建 universal binary → 签名（Developer ID + hardened runtime）→ DMG/zip 打包
# → notarize + staple → SHA256 产物。
# 无签名/公证凭据时直接失败 —— 禁止静默 ad-hoc 降级（Gatekeeper 会拦截）。

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-sign-notarize:
    name: Build · sign · notarize · package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned 1.90.0)
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      # 凭据校验：任一缺失即失败（不再 ad-hoc 降级）
      - name: 校验签名/公证凭据
        run: |
          required=(MACLEAN_CERT_P12_B64 MACLEAN_CERT_PASSWORD MACLEAN_SIGN_IDENTITY MACLEAN_NOTARY_KEY_ID MACLEAN_NOTARY_KEY_P8 MACLEAN_NOTARY_TEAM_ID)
          missing=0
          for v in "${required[@]}"; do
            val="${!v:-}"
            if [ -z "$val" ]; then echo "缺少 $v"; missing=1; fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::发布构建必须配置签名/公证 secrets（Developer ID + notary API key）。禁止无凭据 ad-hoc 降级。" >&2
            exit 1
          fi
        env:
          MACLEAN_CERT_P12_B64: ${{ secrets.MACLEAN_CERT_P12_B64 }}
          MACLEAN_CERT_PASSWORD: ${{ secrets.MACLEAN_CERT_PASSWORD }}
          MACLEAN_SIGN_IDENTITY: ${{ secrets.MACLEAN_SIGN_IDENTITY }}
          MACLEAN_NOTARY_KEY_ID: ${{ secrets.MACLEAN_NOTARY_KEY_ID }}
          MACLEAN_NOTARY_KEY_P8: ${{ secrets.MACLEAN_NOTARY_KEY_P8 }}
          MACLEAN_NOTARY_TEAM_ID: ${{ secrets.MACLEAN_NOTARY_TEAM_ID }}

      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/maclean \
            target/x86_64-apple-darwin/release/maclean \
            -output dist/maclean

      - name: 导入签名证书到临时 keychain
        env:
          CERT_P12_B64: ${{ secrets.MACLEAN_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.MACLEAN_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12_B64" | base64 --decode > /tmp/maclean_cert.p12
          security create-keychain -p ci maclean-ci.keychain
          security default-keychain -s maclean-ci.keychain
          security unlock-keychain -p ci maclean-ci.keychain
          security import /tmp/maclean_cert.p12 -k maclean-ci.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k ci maclean-ci.keychain

      - name: 签名（hardened runtime + entitlements + timestamp）
        env:
          MACLEAN_SIGN_IDENTITY: ${{ secrets.MACLEAN_SIGN_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$MACLEAN_SIGN_IDENTITY" \
            --entitlements packaging/maclean.entitlements \
            dist/maclean

      - name: 校验签名
        run: |
          codesign --verify --deep --strict dist/maclean
          spctl --assess --type execute dist/maclean

      - name: 打包 DMG 与 zip
        run: |
          VERSION=$(grep -m1 '^version' apps/maclean-free/Cargo.toml | cut -d'"' -f2)
          mkdir -p dist/dmg
          cp dist/maclean dist/dmg/
          hdiutil create -volname MacLean -srcfolder dist/dmg -ov -format UDZO \
            "dist/MacLean-${VERSION}-universal.dmg"
          (cd dist && zip -r "MacLean-${VERSION}-universal.zip" maclean)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: 公证（notarize DMG + zip）
        env:
          MACLEAN_NOTARY_KEY_ID: ${{ secrets.MACLEAN_NOTARY_KEY_ID }}
          MACLEAN_NOTARY_KEY_P8: ${{ secrets.MACLEAN_NOTARY_KEY_P8 }}
          MACLEAN_NOTARY_TEAM_ID: ${{ secrets.MACLEAN_NOTARY_TEAM_ID }}
        run: |
          VERSION="${{ env.VERSION }}"
          for f in "dist/MacLean-${VERSION}-universal.dmg" "dist/MacLean-${VERSION}-universal.zip"; do
            echo "notarizing: $f"
            xcrun notarytool submit "$f" \
              --key-id "$MACLEAN_NOTARY_KEY_ID" \
              --key "$MACLEAN_NOTARY_KEY_P8" \
              --team-id "$MACLEAN_NOTARY_TEAM_ID" \
              --wait
            xcrun stapler staple "$f"
            xcrun stapler validate "$f"
          done

      - name: 生成 SHA256
        run: |
          VERSION="${{ env.VERSION }}"
          shasum -a 256 "dist/MacLean-${VERSION}-universal.dmg" "dist/MacLean-${VERSION}-universal.zip" > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: 上传发布产物
        uses: actions/upload-artifact@v5
        with:
          name: maclean-macos-release-${{ env.VERSION }}
          path: |
            dist/MacLean-*-universal.dmg
            dist/MacLean-*-universal.zip
            dist/SHA256SUMS.txt
