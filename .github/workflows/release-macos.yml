name: Release CLI (signed & notarized)

# maclean CLI 发布流水线（2026-10-13 商业化边界调整；2026-10-27 全链路自动化）
#
# 一个 tag 从构建到各分发渠道，全自动，不再需要手工下载 artifact 再发 Release：
#
#   build-sign-notarize ──┬─> publish-crates    crates.io（4 个 crate 按依赖顺序）
#   （universal 签名+公证）├─> publish-r2        Cloudflare R2（downloads.getmaclean.com）
#                        ├─> sync-site         官网 maclean-site（版本号 + 更新日志）
#                        └─> update-homebrew   jamesfeng2009/homebrew-maclean
#
# 无签名/公证凭据时直接失败 —— 禁止静默 ad-hoc 降级（Gatekeeper 会拦截）。
# 同理，R2 / crates.io / homebrew 凭据缺失也在第一步就失败：宁可一次都不发，
# 也不要出现"GitHub Release 有了、crates.io 没有"这种半发布状态。
#
# 说明：GUI App（DMG）的打包/公证/R2 上传在私有 maclean-pro 仓库的
# release-app.yml，不由本文件负责。
#
# 必需 secrets：
#   MACLEAN_CERT_P12_B64 / MACLEAN_CERT_PASSWORD / MACLEAN_SIGN_IDENTITY
#   MACLEAN_NOTARY_KEY_ID / MACLEAN_NOTARY_KEY_P8 / MACLEAN_NOTARY_ISSUER_ID
#   R2_ACCOUNT_ID / R2_BUCKET / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
#   CARGO_REGISTRY_TOKEN          （crates.io，需 publish-new + publish-update 权限）
#   MACLEAN_HOMEBREW_TOKEN        （GitHub PAT，需能推送 homebrew-maclean 与 maclean-site）
# 可选：CLOUDFLARE_DEPLOY_HOOK（maclean-site 靠 Git 集成部署时可留空）

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-sign-notarize:
    name: Build · sign · notarize · package
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned 1.90.0)
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      # 凭据校验：任一缺失即失败（不再 ad-hoc 降级，也不做"跳过某渠道"的静默降级）
      - name: 校验发布凭据
        run: |
          required=(MACLEAN_CERT_P12_B64 MACLEAN_CERT_PASSWORD MACLEAN_SIGN_IDENTITY \
                    MACLEAN_NOTARY_KEY_ID MACLEAN_NOTARY_KEY_P8 MACLEAN_NOTARY_ISSUER_ID \
                    R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
                    CARGO_REGISTRY_TOKEN MACLEAN_HOMEBREW_TOKEN)
          missing=0
          for v in "${required[@]}"; do
            val="${!v:-}"
            if [ -z "$val" ]; then echo "缺少 $v"; missing=1; fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::发布必须配置签名/公证/R2/crates.io/homebrew 全部 secrets。禁止无凭据降级发布。" >&2
            exit 1
          fi
        env:
          MACLEAN_CERT_P12_B64: ${{ secrets.MACLEAN_CERT_P12_B64 }}
          MACLEAN_CERT_PASSWORD: ${{ secrets.MACLEAN_CERT_PASSWORD }}
          MACLEAN_SIGN_IDENTITY: ${{ secrets.MACLEAN_SIGN_IDENTITY }}
          MACLEAN_NOTARY_KEY_ID: ${{ secrets.MACLEAN_NOTARY_KEY_ID }}
          MACLEAN_NOTARY_KEY_P8: ${{ secrets.MACLEAN_NOTARY_KEY_P8 }}
          MACLEAN_NOTARY_ISSUER_ID: ${{ secrets.MACLEAN_NOTARY_ISSUER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          MACLEAN_HOMEBREW_TOKEN: ${{ secrets.MACLEAN_HOMEBREW_TOKEN }}

      - name: 读取版本号（单一来源 Cargo.toml）
        id: version
        run: |
          # 版本号单一来源：根 Cargo.toml [workspace.package] version
          VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | grep -m1 '^version = "' | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "错误：无法从 Cargo.toml 读取 workspace 版本号" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 校验 tag 与 Cargo.toml 版本一致
        # 防止 "改了代码忘了 bump" + "打了旧 tag" 组合出 v0.4.1 内容是 0.4.2
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::tag v${TAG_VERSION} 与 Cargo.toml 版本 ${VERSION} 不一致" >&2
            exit 1
          fi

      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/maclean \
            target/x86_64-apple-darwin/release/maclean \
            -output dist/maclean

      - name: 导入签名证书到临时 keychain
        env:
          CERT_P12_B64: ${{ secrets.MACLEAN_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.MACLEAN_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12_B64" | base64 --decode > /tmp/maclean_cert.p12
          security create-keychain -p ci maclean-ci.keychain
          security default-keychain -s maclean-ci.keychain
          security unlock-keychain -p ci maclean-ci.keychain
          security import /tmp/maclean_cert.p12 -k maclean-ci.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k ci maclean-ci.keychain

      - name: 签名（hardened runtime + timestamp）
        env:
          MACLEAN_SIGN_IDENTITY: ${{ secrets.MACLEAN_SIGN_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$MACLEAN_SIGN_IDENTITY" \
            dist/maclean

      - name: 校验签名（结构；Gatekeeper 信任需公证后）
        run: |
          codesign --verify --deep --strict dist/maclean

      - name: 打包 tar.gz 与公证用 zip
        run: |
          VERSION="${{ env.VERSION }}"
          mkdir -p dist/cli
          cp dist/maclean dist/cli/maclean
          tar -C dist/cli -czf "dist/maclean-${VERSION}-universal.tar.gz" maclean
          (cd dist/cli && zip -r "../maclean-${VERSION}-universal.zip" maclean)

      - name: 公证（notarize zip；notarytool API key 用 --issuer 认证）
        env:
          MACLEAN_NOTARY_KEY_ID: ${{ secrets.MACLEAN_NOTARY_KEY_ID }}
          MACLEAN_NOTARY_KEY_P8: ${{ secrets.MACLEAN_NOTARY_KEY_P8 }}
          MACLEAN_NOTARY_ISSUER_ID: ${{ secrets.MACLEAN_NOTARY_ISSUER_ID }}
        run: |
          VERSION="${{ env.VERSION }}"
          f="dist/maclean-${VERSION}-universal.zip"
          # MACLEAN_NOTARY_KEY_P8 存的是 .p8 文件原始内容（PEM 文本，以 -----BEGIN 开头）。
          # notarytool --key 需要的是文件路径，直接把内容当参数会因 PEM 以 '-' 开头被
          # 解析为无效选项（Invalid option）。故先落盘为临时文件再引用。
          printf '%s\n' "$MACLEAN_NOTARY_KEY_P8" > /tmp/maclean_auth.p8
          chmod 600 /tmp/maclean_auth.p8
          echo "notarizing: $f"
          xcrun notarytool submit "$f" \
            --key-id "$MACLEAN_NOTARY_KEY_ID" \
            --key /tmp/maclean_auth.p8 \
            --issuer "$MACLEAN_NOTARY_ISSUER_ID" \
            --wait
          # stapler 仅支持 .app/.dmg/.pkg 等可嵌入票据的格式，zip 归档会报
          # "Stapler is incapable of working with ZIP archive files"，故跳过。
          # 公证票据存于 Apple 侧：用户解压后首次执行由 Gatekeeper 联网校验
          # （裸命令行二进制无 bundle 结构，spctl --assess 不适用，不做复检）。
          echo "notarization accepted: submission id logged above"

      - name: 生成 SHA256
        run: |
          VERSION="${{ env.VERSION }}"
          shasum -a 256 "dist/maclean-${VERSION}-universal.tar.gz" "dist/maclean-${VERSION}-universal.zip" > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: 上传发布产物
        uses: actions/upload-artifact@v5
        with:
          name: maclean-cli-release-${{ env.VERSION }}
          path: |
            dist/maclean-*-universal.tar.gz
            dist/maclean-*-universal.zip
            dist/SHA256SUMS.txt

      # 自动化第 3 步：不再需要人工从 Actions artifacts 拉文件再 gh release create。
      - name: 创建/更新 GitHub Release 并附加 macOS 产物
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在（Windows 流水线可能先建），追加 macOS 产物"
          else
            # windows-ci.yml 的 windows-release job 也在同一 tag 上建 Release，
            # 两边并发创建会撞 422 already_exists。这里允许失败：撞上就说明
            # 对方已经建好了，紧接着的 upload 仍然能成功。
            gh release create "$TAG" --title "$TAG" --generate-notes || true
            gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" \
            "dist/maclean-${VERSION}-universal.tar.gz" \
            "dist/maclean-${VERSION}-universal.zip" \
            dist/SHA256SUMS.txt --clobber

  # ---------------------------------------------------------------- crates.io
  # 按依赖顺序发布。cargo 会自动等待上游版本进入 index 后再打包下游，
  # 所以不需要手工 sleep。
  publish-crates:
    name: Publish to crates.io
    needs: build-sign-notarize
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned 1.90.0)
        uses: dtolnay/rust-toolchain@1.90.0

      - name: 发布（幂等：已存在的版本跳过）
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.build-sign-notarize.outputs.version }}
        run: |
          # 顺序即依赖顺序，不能调整：
          #   maclean-types → maclean-core → maclean-cli-contract → maclean-cli
          # maclean-storage / maclean-platform 标了 publish = false，不在此列。
          CRATES=(maclean-types maclean-core maclean-cli-contract maclean-cli)
          UA="maclean-release-ci (https://github.com/${GITHUB_REPOSITORY})"

          for c in "${CRATES[@]}"; do
            # 重跑保护：crates.io 的版本一旦发布就不能覆盖，重复 publish 会 400。
            # 先查存在性，已发布就跳过 —— 让整个 job 可重入。
            if curl -fsS -o /dev/null -H "User-Agent: ${UA}" \
                 "https://crates.io/api/v1/crates/${c}/${VERSION}"; then
              echo "跳过 ${c} ${VERSION}（已发布）"
              continue
            fi
            echo "发布 ${c} ${VERSION}"
            cargo publish -p "$c"
          done

  # ---------------------------------------------------------------------- R2
  publish-r2:
    name: Upload to Cloudflare R2
    needs: build-sign-notarize
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: maclean-cli-release-${{ needs.build-sign-notarize.outputs.version }}
          path: dist

      - name: 生成 latest.json（与 maclean-pro 同 schema，便于站点统一读取）
        env:
          VERSION: ${{ needs.build-sign-notarize.outputs.version }}
        run: |
          cd dist
          TAR="maclean-${VERSION}-universal.tar.gz"
          # SHA256SUMS.txt 由 `shasum dist/xxx` 生成，第二列带 `dist/` 前缀，
          # 用 " ${TAR}$" 直接 grep 永远匹配不到（0.4.2 首次自动发布即因此失败）。
          SHA=$(awk -v f="$TAR" 'index($2,f)==length($2)-length(f)+1 {print $1}' SHA256SUMS.txt)
          if [ -z "$SHA" ]; then
            echo "::error::SHA256SUMS.txt 里找不到 ${TAR}" >&2
            exit 1
          fi
          SIZE=$(stat -c%s "$TAR")
          python3 - "$VERSION" "$SHA" "$SIZE" <<'PY'
          import json, os, sys
          version, sha, size = sys.argv[1:4]
          latest = {
              "version": version,
              "platforms": {
                  "macos": {
                      "url": f"https://downloads.getmaclean.com/maclean-cli/v{version}/maclean-{version}-universal.tar.gz",
                      "sha256": sha,
                      "size": int(size),
                      "published_at": os.popen("date -u +%Y-%m-%dT%H:%M:%SZ").read().strip(),
                      "notes": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/v{version}",
                  }
              },
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(latest, f, ensure_ascii=False, indent=2)
          PY
          cat latest.json

      - name: 上传 R2（downloads.getmaclean.com/maclean-cli/）
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ needs.build-sign-notarize.outputs.version }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_EC2_METADATA_DISABLED=true

          # 版本化路径：不可变，长缓存（客户端按完整版本号引用）
          for f in "maclean-${VERSION}-universal.tar.gz" "maclean-${VERSION}-universal.zip" "SHA256SUMS.txt"; do
            case "$f" in
              *.tar.gz) CT="application/gzip" ;;
              *.zip)    CT="application/zip" ;;
              *.txt)    CT="text/plain; charset=utf-8" ;;
              *)        CT="application/octet-stream" ;;
            esac
            aws s3 cp "dist/$f" "s3://${R2_BUCKET}/maclean-cli/v${VERSION}/$f" \
              --endpoint-url "$ENDPOINT" --region auto \
              --content-type "$CT" \
              --cache-control "public,max-age=31536000,immutable"
          done

          # 指针文件：路径固定，必须 no-cache，否则站点/CDN 会读到旧版本号
          aws s3 cp dist/latest.json "s3://${R2_BUCKET}/maclean-cli/latest.json" \
            --endpoint-url "$ENDPOINT" --region auto \
            --content-type "application/json" \
            --cache-control "no-cache"

          echo "已上传 v${VERSION} 到 R2"

          # 回读校验：自定义域没绑到该 bucket 时这里会暴露。只告警不失败 ——
          # 上传本身已成功，公网可见性属于 Cloudflare 侧配置问题，不该把
          # 一次成功的发布标记为失败。
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://downloads.getmaclean.com/maclean-cli/latest.json" || echo 000)
          if [ "$CODE" = "200" ]; then
            echo "✅ downloads.getmaclean.com/maclean-cli/latest.json 可访问"
          else
            echo "::warning::latest.json 回读 HTTP ${CODE}（上传成功，检查 R2 自定义域/公共访问配置）"
          fi

  # ---------------------------------------------------------------- 官网同步
  # www.getmaclean.com 是独立仓库 jamesfeng2009/maclean-site（Astro + wrangler
  # deploy 到 Cloudflare Workers），站内有两处会因为发版而漂移：
  #   - src/data/site.ts 的 version/updated（渲染进 JSON-LD softwareVersion）
  #   - src/i18n/{en,zh}.ts 的 changelog.entries（旧的"当前版本"要降级）
  # 2026-10-27 之前全靠手工改三个文件再手动部署，漏一次就是页面版本号和
  # Cargo.toml 对不上。
  #
  # 变更条目正文从 release-notes/<version>.json 读（en/zh 两个等长数组）。
  # 没有该文件时写占位条目并打 warning —— 机器不编造营销文案。
  sync-site:
    name: Sync version to maclean-site
    needs: build-sign-notarize
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 克隆官网仓库
        env:
          # 同一个 PAT 同时用于 homebrew-maclean 和 maclean-site（repo 权限）
          TOKEN: ${{ secrets.MACLEAN_HOMEBREW_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/jamesfeng2009/maclean-site.git" /tmp/site

      - name: 校验对官网仓库的写权限
        # clone 成功 ≠ 能推。--dry-run 不产生提交，但能把 PAT 缺 maclean-site
        # 写权限这件事提前暴露，而不是改完文件才在最后一步失败。
        run: |
          cd /tmp/site
          git push --dry-run origin HEAD:main

      - name: 同步版本号与更新日志
        env:
          VERSION: ${{ needs.build-sign-notarize.outputs.version }}
        run: node scripts/sync-site-release.mjs /tmp/site "$VERSION"

      - name: 提交并推送
        env:
          VERSION: ${{ needs.build-sign-notarize.outputs.version }}
        run: |
          cd /tmp/site
          git config user.name "maclean-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/site.ts src/i18n/en.ts src/i18n/zh.ts
          if git diff --cached --quiet; then
            echo "官网已是 v${VERSION}，无需提交"
            exit 0
          fi
          git commit -m "chore(site): 同步站点版本到 v${VERSION} 并更新更新日志"
          git push origin HEAD:main

      # Cloudflare 若是 Git 集成部署，上一步 push 已自动构建；有 Deploy Hook
      # 就再显式触发一次（幂等）。两者都没有时下面的回读会暴露问题。
      - name: 触发 Cloudflare 重新构建（可选）
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "未配置 CLOUDFLARE_DEPLOY_HOOK，依赖 Cloudflare Git 集成自动构建"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "已触发 Deploy Hook"

      - name: 回读线上版本（复核部署已生效）
        env:
          VERSION: ${{ needs.build-sign-notarize.outputs.version }}
        run: |
          # 只告警不失败：产物与源码仓库都已就绪，站点没跟上属于 Cloudflare
          # 侧部署配置问题，不该把一次成功的发布标记成红色。但必须吼出来，
          # 否则就是这次要修的那个"页面版本停在旧版"的老毛病。
          for _ in $(seq 1 24); do
            if curl -s "https://www.getmaclean.com/download/" \
                 | grep -q "\"softwareVersion\":\"${VERSION}\""; then
              echo "✅ www.getmaclean.com 已显示 v${VERSION}"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::官网 4 分钟内未更新到 v${VERSION}。若 Cloudflare 未开启 Git 集成，需在 maclean-site 手动执行 npm run deploy（或配置 CLOUDFLARE_DEPLOY_HOOK）。"

  # ---------------------------------------------------------------- homebrew
  # 用可复用工作流直接调用，不依赖 `release: published` 事件 ——
  # GITHUB_TOKEN 创建 Release 产生的 published 事件不会触发新 workflow 运行
  # （GitHub 防递归规则），这正是 0.3.3~0.4.1 期间 formula 一直靠手工回填的根因。
  update-homebrew:
    name: Update Homebrew Tap
    needs: build-sign-notarize
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/update-homebrew-tap.yml
    with:
      version: ${{ needs.build-sign-notarize.outputs.version }}
    secrets: inherit
