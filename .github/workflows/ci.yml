name: CI

# 质量门禁：格式 / 静态检查 / 单元测试 / macOS 构建
# Windows 构建仍由 windows-ci.yml 负责

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt · clippy · test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned 1.90.0)
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-quality-

      - name: 代码格式检查
        run: cargo fmt --all -- --check

      - name: Clippy 静态检查
        # 2026-09-18 起阻塞：7 个 static mut 已迁入 GuiState，102 条存量告警
        # 已清零（含删除 aewp.rs 等整块死代码）。现在 `-D warnings` 能过，
        # 门禁应当真正生效 —— 否则新告警会一直被静默放行。
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试（workspace = 5 公开 crate + CLI）
        run: cargo test --workspace

  macos-build:
    name: macOS release build
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned 1.90.0)
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-macos-

      - name: 构建 release
        run: cargo build --release

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: maclean-macos-${{ runner.arch }}
          path: target/release/maclean

  version-consistency:
    name: 版本号一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 校验 Makefile / 打包脚本与 Cargo.toml 版本一致
        run: |
          CARGO_VERSION=$(grep -m1 '^version' apps/maclean-cli/Cargo.toml | cut -d'"' -f2)
          echo "Cargo.toml 版本: $CARGO_VERSION"
          if grep -n '^VERSION' Makefile | grep -q "0\.1\.0\|0\.2\.0"; then
            echo "错误：Makefile 里存在硬编码版本号，应改为从 Cargo.toml 读取" >&2
            exit 1
          fi
          if grep -n 'VERSION=' scripts/build-cli-package.sh | grep -q '"[0-9]'; then
            echo "错误：build-cli-package.sh 里存在硬编码版本号，应改为从 Cargo.toml 读取" >&2
            exit 1
          fi
          echo "✅ 版本号来源唯一（Cargo.toml）"

  security:
    name: cargo audit · cargo deny（漏洞/许可/来源门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned 1.90.0)
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-security-

      - name: Install cargo-audit / cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      # P1（2026-10-12）：漏洞扫描 + 依赖治理（deny.toml 已入库）
      - name: cargo audit（已知漏洞扫描）
        run: cargo audit

      - name: cargo deny check（许可/来源/重复依赖）
        run: cargo deny check
