name: CI

# 质量门禁：格式 / 静态检查 / 单元测试 / macOS 构建 / Linux 原生门禁
# Windows 构建与测试仍由 windows-ci.yml 的原生 runner 负责
# （macOS 本机不做 MSVC 交叉编译：ring 的 C 构建需要 MSVC SDK）

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt · clippy · test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned 1.99.1)
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-quality-

      - name: 代码格式检查
        run: cargo fmt --all -- --check

      - name: Clippy 静态检查
        # 2026-09-18 起阻塞：7 个 static mut 已迁入 GuiState，102 条存量告警
        # 已清零（含删除 aewp.rs 等整块死代码）。现在 `-D warnings` 能过，
        # 门禁应当真正生效 —— 否则新告警会一直被静默放行。
        # H-04：必须 --workspace —— default-members 仅 apps/maclean-cli，漏掉它
        # 3 个库 crate 就完全不 lint；本机 --workspace --all-targets 已验证干净。
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元测试（workspace = 3 个库 crate + CLI）
        run: cargo test --workspace

  # CORE-06 后续：此前 ci.yml 的两个 ubuntu job（version-consistency / security）
  # 全是 shell 脚本与 cargo audit/deny，没有一个跑 Rust 编译或测试 ——
  # #[cfg(not(any(macos, windows)))] 分支在 CI 上长期 0 编译 0 测试，
  # 而该分支历史上正是 validate_rule_root 的 fail-open 实现所在。
  # 必须用原生 Linux runner 覆盖，不能靠 macOS 上的交叉编译（缺 Linux C 编译器）。
  linux-check:
    name: check · clippy · test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned 1.99.1)
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-linux-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-linux-

      # --all-targets 必须带：否则 #[cfg(test)] 里的 Linux 分支根本不编译，
      # 与 windows-ci.yml 里 H-05 吃过的是同一个亏。
      - name: Cargo check (Linux, --all-targets)
        run: cargo check --target x86_64-unknown-linux-gnu --workspace --all-targets

      # 这里刻意不加 -D warnings：本机实测
      # `cargo clippy -p maclean-core --all-targets --target x86_64-unknown-linux-gnu`
      # 有 38 条存量 warning（绝大多数是 macOS 专属函数在非 mac 平台 dead_code，
      # 另有 6 条 cloned_ref_to_slice_refs），本次改动未新增任何一条。
      # 存量清理需单独排期，不该让新加的 Linux 门禁第一天就红。
      # clippy 仍运行：能抓 Linux cfg 分支里的真实 lint 问题，只是暂不阻塞。
      - name: Clippy (Linux, 存量 warning 暂不阻塞)
        run: cargo clippy --target x86_64-unknown-linux-gnu --workspace --all-targets

      # 首次在 Linux runner 实跑后按结果收口平台专属用例；本机无 Linux 执行
      # 环境，只做过 --all-targets 的交叉 clippy，不冒充已验证运行时行为。
      - name: 单元测试（workspace）
        run: cargo test --target x86_64-unknown-linux-gnu --workspace --no-fail-fast

  macos-build:
    name: macOS release build
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned 1.99.1)
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-macos-

      - name: 构建 release
        run: cargo build --release

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: maclean-macos-${{ runner.arch }}
          path: target/release/maclean

  version-consistency:
    name: 版本号一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 校验版本号来源唯一（workspace.package）
        run: |
          # 版本号单一来源：根 Cargo.toml 的 [workspace.package] version。
          # 2026-10-27 前各成员单独写死版本（crates 停在 0.2.x、apps 跟 release
          # 走到 0.4.x），这个 job 只查"有没有硬编码"、不查成员之间是否一致，
          # 于是漂移了一整年没被发现。
          VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | grep -m1 '^version = "' | cut -d'"' -f2)
          echo "workspace 版本: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "错误：无法从 Cargo.toml 的 [workspace.package] 读取版本号" >&2
            exit 1
          fi

          # 1) 每个成员必须继承 workspace 版本，不能写死字面量
          for f in crates/*/Cargo.toml apps/*/Cargo.toml; do
            [ -f "$f" ] || continue
            if grep -q '^version *= *"' "$f"; then
              echo "错误：$f 写死了版本号，应改为 version.workspace = true" >&2
              exit 1
            fi
            if ! grep -q '^version\.workspace *= *true' "$f"; then
              echo "错误：$f 缺少 version.workspace = true" >&2
              exit 1
            fi
          done

          # 2) H-07 / I-01：Makefile 求值结果必须等于根 [workspace.package] 版本。
          #    旧检查只 grep Makefile 里有没有 0.1.0|0.2.0 字面量，抓不到
          #    `grep '^version' apps/maclean-cli/Cargo.toml` 取到字符串
          #    "version.workspace = true" 这种错（VERSION 根本不是版本号）。
          MAKE_VERSION=$(make -s print-version)
          echo "Makefile 求值版本: $MAKE_VERSION"
          if [ "$MAKE_VERSION" != "$VERSION" ]; then
            echo "错误：Makefile VERSION ($MAKE_VERSION) != Cargo.toml ($VERSION)" >&2
            exit 1
          fi
          if grep -n 'VERSION=' scripts/build-cli-package.sh | grep -q '"[0-9]'; then
            echo "错误：build-cli-package.sh 里存在硬编码版本号，应改为从 Cargo.toml 读取" >&2
            exit 1
          fi

          # 2b) H-07：homebrew formula 引用的 tag 必须可解析、且不得超前于根版本。
          #     formula 跟随「上一次 release」，平时允许落后一个 patch；严格相等
          #     （tag == 根版本）由 release-macos.yml 的校验步骤在打 tag 时负责。
          if [ -f homebrew/maclean.rb ]; then
            FORMULA_TAG=$(grep -m1 -oE 'archive/refs/tags/v[0-9]+\.[0-9]+\.[0-9]+' homebrew/maclean.rb | sed 's|.*/v||')
            echo "homebrew formula tag: ${FORMULA_TAG:-<未解析>}"
            if [ -z "$FORMULA_TAG" ]; then
              echo "错误：无法从 homebrew/maclean.rb 解析 release tag" >&2
              exit 1
            fi
            if [ "$(printf '%s\n%s\n' "$FORMULA_TAG" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
              echo "错误：formula tag $FORMULA_TAG 超前于根版本 $VERSION" >&2
              exit 1
            fi
          fi

          # 3) 二进制自报版本必须与 workspace 版本一致（防 --version 撒谎）
          if grep -q '^version\.workspace *= *true' apps/maclean-cli/Cargo.toml; then
            echo "✅ 版本号来源唯一（Cargo.toml [workspace.package] = $VERSION）"
          fi

          # 4) [workspace.dependencies] 里内部 crate 的 version 必须与
          #    [workspace.package] version 逐字相等。
          #    这两个字段不能互相继承（cargo 不支持依赖版本写 workspace 继承），
          #    一旦不等，cargo publish 会拿着旧版本号去 registry 找一个不存在的
          #    依赖，发布在最后一个 crate 才炸，前面几个已经发出去了 —— 撤不回。
          MISMATCH=0
          while IFS= read -r line; do
            case "$line" in
              maclean-*)
                DEP_VER=$(printf '%s' "$line" | sed -n 's/.*version = "\([^"]*\)".*/\1/p')
                DEP_NAME=$(printf '%s' "$line" | cut -d' ' -f1)
                if [ -z "$DEP_VER" ]; then
                  echo "错误：$DEP_NAME 缺少 version，cargo publish 会直接失败" >&2
                  MISMATCH=1
                elif [ "$DEP_VER" != "$VERSION" ]; then
                  echo "错误：$DEP_NAME 的 version ($DEP_VER) != workspace 版本 ($VERSION)" >&2
                  MISMATCH=1
                fi
                ;;
            esac
          done < <(sed -n '/^\[workspace\.dependencies\]/,/^\[/p' Cargo.toml)
          if [ "$MISMATCH" -eq 1 ]; then
            echo "修复：./scripts/bump-version.sh $VERSION" >&2
            exit 1
          fi
          echo "✅ [workspace.dependencies] 内部 crate 版本已对齐 $VERSION"

          # 5) 可发布 crate 的内部依赖必须带 version（path-only 无法 publish）
          for f in crates/maclean-types/Cargo.toml crates/maclean-core/Cargo.toml \
                   crates/maclean-cli/Cargo.toml apps/maclean-cli/Cargo.toml \
                   crates/maclean-storage/Cargo.toml; do
            [ -f "$f" ] || continue
            if grep -qE '^maclean-[\w-]+ *= *\{ *path = "[^"]+" *\}$' "$f"; then
              echo "错误：$f 里有 path-only 内部依赖，cargo publish 会失败" >&2
              echo "      改为 <crate>.workspace = true（见根 Cargo.toml [workspace.dependencies]）" >&2
              exit 1
            fi
          done
          echo "✅ 内部依赖均可发布"

  security:
    # H-06：在原 audit/deny 基础上补依赖评审与防泄漏扫描，失败即阻塞
    name: cargo audit · cargo deny · dependency review · secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned 1.99.1)
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-security-

      - name: Install cargo-audit / cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      # P1（2026-10-12）：漏洞扫描 + 依赖治理（deny.toml 已入库）
      - name: cargo audit（已知漏洞扫描）
        run: cargo audit

      - name: cargo deny check（许可/来源/重复依赖）
        run: cargo deny check

      # H-06 / G-4：PR 依赖变更评审，新增有漏洞/受限许可依赖即阻塞（仅 PR 有 diff）
      - name: Dependency review（PR 依赖变更评审）
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low

      # H-06 / G-6：防泄漏 grep。关闭 gitleaks 官方 action 的理由：其组织使用需
      # GITLEAKS_LICENSE 授权（付费），且引入第三方 action 有供应链风险；本公开仓库
      # 无密钥历史，改用仓库内可审计的 scripts/check-no-leaks.sh 覆盖已知模式。
      # 无 continue-on-error —— 失败即阻塞。
      - name: 防泄漏扫描（私有包名 / 密钥模式）
        run: bash scripts/check-no-leaks.sh
