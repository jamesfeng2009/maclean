name: CI

# 质量门禁：格式 / 静态检查 / 单元测试 / macOS 构建
# Windows 构建仍由 windows-ci.yml 负责

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt · clippy · test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-quality-

      - name: 代码格式检查
        run: cargo fmt --all -- --check

      - name: Clippy 静态检查
        # 暂不阻塞：仓库仍有 ~76 处 `static mut` 引用产生的存量告警（见 CODE_REVIEW.md P2），
        # 需要把 7 个 static mut 全局迁入 Mutex / App 状态后才能开启 -D warnings。
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --bin maclean

  macos-build:
    name: macOS release build
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-macos-

      - name: 构建 release
        run: cargo build --release

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: maclean-macos-${{ runner.arch }}
          path: target/release/maclean

  version-consistency:
    name: 版本号一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 校验 Makefile / 打包脚本与 Cargo.toml 版本一致
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "Cargo.toml 版本: $CARGO_VERSION"
          if grep -n '^VERSION' Makefile | grep -q "0\.1\.0\|0\.2\.0"; then
            echo "错误：Makefile 里存在硬编码版本号，应改为从 Cargo.toml 读取" >&2
            exit 1
          fi
          if grep -n 'VERSION=' scripts/build-package.sh | grep -q '"[0-9]'; then
            echo "错误：build-package.sh 里存在硬编码版本号，应改为从 Cargo.toml 读取" >&2
            exit 1
          fi
          echo "✅ 版本号来源唯一（Cargo.toml）"
