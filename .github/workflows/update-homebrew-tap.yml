name: Update Homebrew Tap

# 把 jamesfeng2009/homebrew-maclean 的 Formula/maclean.rb 更新到指定版本：
# version + 源码 tarball sha256 一次回填。
#
# 三个触发入口：
#   1. workflow_call —— release-macos.yml 在 tag 发布时直接调用（主路径）
#   2. release: published —— 手动在网页上发 Release 时兜底
#   3. workflow_dispatch —— 本地/补救手动触发
#
# 为什么不让它只靠 `release: published`：
# GitHub 的防递归规则 —— 用 GITHUB_TOKEN 创建 Release 所产生的 published
# 事件**不会**触发新的 workflow 运行（workflow_dispatch / repository_dispatch
# 例外）。release-macos.yml 正是用 GITHUB_TOKEN 建 Release，所以 0.3.3~0.4.1
# 期间这个 workflow 从未被触发过，formula 全靠手工回填。改成 workflow_call
# 直接调用后，链路不再依赖事件传播。
#
# 依赖 secrets.MACLEAN_HOMEBREW_TOKEN（GitHub PAT，repo 权限，能推送
# homebrew-maclean 仓库）。未配置时本 workflow 明确失败 —— 不做静默降级。
#
# 本地等价命令：./scripts/update-homebrew-formula.sh

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要回填的版本号（不含 v 前缀；留空则读 Cargo.toml）"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "要回填的版本号（不含 v 前缀）"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  update-tap:
    name: Update homebrew-maclean Formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 读取目标版本
        id: version
        run: |
          # 优先级：workflow_call 入参 > 触发它的 Release tag > 当前 Cargo.toml。
          #
          # 关键：由 Release 事件触发时必须用 *该 Release 的 tag*，不能用
          # Cargo.toml —— 补发一个旧版本 Release（如重发 v0.4.1）时，Cargo.toml
          # 已经走到 0.4.2 了，用它会算出错误的 tarball URL 和 sha256。
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          fi
          if [ -z "$VERSION" ]; then
            # 兜底：版本号单一来源 根 Cargo.toml [workspace.package] version
            VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
              | grep -m1 '^version = "' | cut -d'"' -f2)
          fi
          if [ -z "$VERSION" ]; then
            echo "错误：无法确定要回填的版本号" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "目标版本: v$VERSION"

      - name: 下载源码 tarball 并计算 sha256
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz"
          curl -fsSL "$URL" -o /tmp/maclean.tar.gz
          SHA=$(shasum -a 256 /tmp/maclean.tar.gz | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha256: $SHA"

      # 检查 tap 推送凭据：缺失即失败（不静默跳过，避免公式停在旧版本）
      - name: 校验 Homebrew PAT
        env:
          TOKEN: ${{ secrets.MACLEAN_HOMEBREW_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::缺少 secrets.MACLEAN_HOMEBREW_TOKEN（GitHub PAT，repo 权限）。" >&2
            echo "::error::配置后 tap 仓库 Formula 才能在发布时自动更新。" >&2
            exit 1
          fi

      - name: 检出 tap 仓库并更新 Formula
        env:
          TOKEN: ${{ secrets.MACLEAN_HOMEBREW_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/jamesfeng2009/homebrew-maclean.git" /tmp/tap
          cd /tmp/tap
          python3 - <<'PY'
          import re, os

          path = "Formula/maclean.rb"
          version = os.environ["VERSION"]
          sha = os.environ["SHA256"]

          with open(path, encoding="utf-8") as f:
              text = f.read()

          text = re.sub(
              r'^\s*url "[^"]+"',
              f'  url "https://github.com/jamesfeng2009/maclean/archive/refs/tags/v{version}.tar.gz"',
              text, count=1, flags=re.M,
          )
          text = re.sub(
              r'^\s*sha256 "[0-9a-f]+"',
              f'  sha256 "{sha}"',
              text, count=1, flags=re.M,
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          git config user.name "maclean-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/maclean.rb
          if git diff --cached --quiet; then
            echo "Formula 无变化，跳过提交"
          else
            git commit -m "Update maclean to v${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi
