name: Windows Build CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows-check:
    name: Windows cargo check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-check-

      - name: Cargo check (Windows)
        # --all-targets 必须带上：否则 #[cfg(test)] 里的 Windows 分支不会被编译，
        # 测试代码烂掉也发现不了。2026-09 之前正是漏了这个参数，
        # 让 13 个 Windows 编译错误在工作区里躺了很久也没人察觉。
        run: cargo check --target x86_64-pc-windows-msvc --all-targets

  windows-build:
    name: Windows release build
    runs-on: windows-latest
    needs: windows-check
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build release
        # 纯 CLI 构建（workspace 默认成员 apps/maclean-cli），无 GUI / 无 license 逻辑
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: 冒烟验证 exe
        # 直接执行 exe 验证：存在 + --help 可用。
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/maclean.exe"
          if (-not (Test-Path $exe)) { throw "未找到 $exe" }

          $help = & $exe --help 2>&1 | Out-String
          if ($help -notmatch "scan") { throw "--help 未输出命令列表" }
          Write-Host "CLI 冒烟通过：--help 可用"

      - name: 打包发布产物
        # 之前只上传裸 exe，用户下载后没有校验手段、也没有版本标识。
        # 这里产出带版本号的 zip + SHA256，版本号从 Cargo.toml 取（唯一来源）。
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' apps/maclean-cli/Cargo.toml | cut -d'"' -f2)
          echo "版本: $VERSION"
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/maclean.exe dist/
          cp README.md dist/ 2>/dev/null || echo "（无 README，跳过）"
          cd dist
          # sha256 只覆盖 exe：README 会随文档改动而变，不该让校验和漂移。
          # certutil 会输出标题行和状态行，只取 64 位十六进制那一行。
          if command -v certutil >/dev/null 2>&1; then
            certutil -hashfile maclean.exe SHA256 | grep -E '^[0-9a-fA-F]{64}$' > maclean.exe.sha256
          else
            sha256sum maclean.exe | cut -d' ' -f1 > maclean.exe.sha256
          fi
          # 拿不到就红 —— 宁可没产物，也不要发一个无法校验的包
          grep -qE '^[0-9a-fA-F]{64}$' maclean.exe.sha256 || {
            echo "错误：未能生成 SHA256 校验和" >&2; exit 1; }
          cat maclean.exe.sha256
          cd ..
          mv dist "maclean-windows-x86_64-$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: maclean-windows-x86_64
          path: maclean-windows-x86_64-*
