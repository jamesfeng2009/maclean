name: Windows Build CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows-check:
    name: Windows cargo check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-check-

      - name: Cargo check (Windows)
        # --all-targets 必须带上：否则 #[cfg(test)] 里的 Windows 分支不会被编译，
        # 测试代码烂掉也发现不了。2026-09 之前正是漏了这个参数，
        # 让 13 个 Windows 编译错误在工作区里躺了很久也没人察觉。
        run: cargo check --target x86_64-pc-windows-msvc --all-targets

  windows-build:
    name: Windows release build
    runs-on: windows-latest
    needs: windows-check
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build release
        # 注意：release 构建不得启用 dev-mode feature，否则打出的 exe 人人免费用
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: maclean-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/maclean.exe
