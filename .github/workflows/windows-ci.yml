name: Windows Build CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows-check:
    name: Windows cargo check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-check-

      - name: Cargo check (Windows)
        # --all-targets 必须带上：否则 #[cfg(test)] 里的 Windows 分支不会被编译，
        # 测试代码烂掉也发现不了。2026-09 之前正是漏了这个参数，
        # 让 13 个 Windows 编译错误在工作区里躺了很久也没人察觉。
        run: cargo check --target x86_64-pc-windows-msvc --all-targets

  windows-build:
    name: Windows release build
    runs-on: windows-latest
    needs: windows-check
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build release
        # 纯 CLI 构建（workspace 默认成员 apps/maclean-cli），无 GUI / 无 license 逻辑
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: 冒烟验证 exe
        # 直接执行 exe 验证：存在 + --help 可用。
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/maclean.exe"
          if (-not (Test-Path $exe)) { throw "未找到 $exe" }

          $help = & $exe --help 2>&1 | Out-String
          if ($help -notmatch "scan") { throw "--help 未输出命令列表" }
          Write-Host "CLI 冒烟通过：--help 可用"

      - name: Install NSIS
        # 生成双击即装安装器（自动写入 PATH），用户无需手动设置环境变量
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: 打包发布产物
        # 产出：NSIS 安装器（主推，双击安装+自动加 PATH）+ 可移植 zip + 独立 sha256
        # 版本号从 Cargo.toml 取（唯一来源）。release job 直接上传这些文件。
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' apps/maclean-cli/Cargo.toml | cut -d'"' -f2)
          echo "版本: $VERSION"
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/maclean.exe dist/
          # --- NSIS 安装器：双击安装 + 自动加 PATH（HKCU，免提权）---
          # choco nsis 是便携包，makensis 不在 PATH，需探测完整路径
          MAKENSIS=""
          for p in "$(command -v makensis 2>/dev/null)" "C:/ProgramData/chocolatey/lib/nsis/tools/NSIS/makensis.exe" "C:/Program Files (x86)/NSIS/makensis.exe"; do
            if [ -n "$p" ] && [ -f "$p" ]; then MAKENSIS="$p"; break; fi
          done
          [ -z "$MAKENSIS" ] && { echo "错误：makensis 未找到" >&2; exit 1; }
          echo "makensis: $MAKENSIS"
          # maclean.exe 复制到脚本同目录（NSIS File 相对脚本目录解析）
          cp target/x86_64-pc-windows-msvc/release/maclean.exe packaging/windows/maclean.exe
          # MSYS_NO_PATHCONV=1：防止 Git Bash 把 /D 参数当 POSIX 路径转换
          MSYS_NO_PATHCONV=1 "$MAKENSIS" -DVERSION="$VERSION" packaging/windows/installer.nsi
          ls -la packaging/windows/maclean-setup-$VERSION.exe
          cp packaging/windows/maclean-setup-$VERSION.exe dist/
          cp README.md dist/ 2>/dev/null || echo "（无 README，跳过）"
          cd dist
          # sha256 覆盖 setup.exe（用户实际安装的文件）
          if command -v certutil >/dev/null 2>&1; then
            certutil -hashfile maclean-setup-$VERSION.exe SHA256 | grep -E '^[0-9a-fA-F]{64}$' > maclean-setup-$VERSION.sha256
          else
            sha256sum maclean-setup-$VERSION.exe | cut -d' ' -f1 > maclean-setup-$VERSION.sha256
          fi
          # 拿不到就红 —— 宁可没产物，也不要发一个无法校验的包
          grep -qE '^[0-9a-fA-F]{64}$' maclean-setup-$VERSION.sha256 || {
            echo "错误：未能生成 SHA256 校验和" >&2; exit 1; }
          cat maclean-setup-$VERSION.sha256
          cd ..
          # 可移植备选 zip：setup.exe + README + sha256（不想装的可直接解压用）
          powershell -Command "Compress-Archive -Path 'dist/*' -DestinationPath 'maclean-windows-x86_64-$VERSION.zip' -Force"
          # 统一产物到 workspace root（upload-artifact 多路径会保留目录前缀，
          # 导致 release glob 匹配不到，这里全部平铺到 root 单路径）
          cp packaging/windows/maclean-setup-$VERSION.exe ./maclean-setup-$VERSION.exe
          cp dist/maclean-setup-$VERSION.sha256 ./maclean-setup-$VERSION.sha256
          ls -la maclean-windows-x86_64-$VERSION.zip maclean-setup-$VERSION.exe maclean-setup-$VERSION.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: maclean-windows-x86_64
          path: maclean-*

  windows-release:
    name: Publish Windows release (tag only)
    runs-on: ubuntu-latest
    needs: windows-build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: maclean-windows-x86_64
          path: dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/maclean-*
          generate_release_notes: true
          draft: false
          prerelease: false
