# cargo-deny 配置（P9-10，2026-10-08）
# 用法：cargo install cargo-deny && cargo deny check
# 目标：license 兼容 / banned / advisories 三道门禁。

[advisories]
db-path = "~/.cargo/advisory-db"
# 新版 cargo-deny：vulnerability/unsound/notice/severity-threshold 已移除，
# 所有漏洞类 advisory 一律报错；如需忽略请加到 ignore。
# 未维护 crate 的失败范围：all=任何未维护 crate 均失败（保持原"deny"语义）
unmaintained = "all"
yanked = "deny"
# 工作区内的私有 crate 不检查 advisory（未发布）
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# 禁止出现在依赖图中的 crate（一般留空，按需增补）
deny = []
# 跳过对自身 workspace 成员的检查
skip = []
skip-tree = []

[licenses]
# 允许的 license 集合（SPDX 标识）
# 新版 cargo-deny：未在 allow 白名单内的 license 一律拒绝
# （原 deny 列表字段已移除，GPL/AGPL/LGPL 天然被拒，无需显式列出）
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
# license 识别失败即报错（原 unlicensed 字段已移除）；
# 需要人工确认的 crate 在 clarify 中声明
confidence-threshold = 0.8
# 私有 crate（publish=false）不强制 license 匹配
exceptions = [
    # 示例：若某依赖 license 识别失败且人工核对可接受，在此声明
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0 }]

