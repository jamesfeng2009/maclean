[package]
name = "maclean-core"
version = "0.2.0"
edition = "2021"
description = "maclean 核心逻辑：扫描 / 安全闸门 / 删除执行 / 调度（UI 无关）"

# UI 无关的核心 crate。egui 壳（maclean bin）与 Tauri 壳（maclean-tauri）
# 都只通过本 crate 的公开 API 触达文件系统；任何删除都必须经过 safety 闸门。
# 本 crate 不依赖任何窗口 / Web 技术，可在 CI / 容器中独立编译测试。
[dependencies]
walkdir = "2.5"
rayon = "1.10"
dirs = "5.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# macOS 进程内「移入废纸篓」（NSFileManager / NSWorkspace），替代旧的
# osascript 让 Finder 跨进程代删——后者受 TCC 自动化限制、授权回调不稳，
# 会出现 Touch ID 不可用、输密码后 can't operate。版本与 Tauri 依赖树对齐，
# 避免引入重复大版本。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSDictionary", "NSError", "NSFileManager"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "block2"] }
block2 = "0.6"
dispatch2 = "0.3"

[features]
# 开发模式透传：与 maclean bin 的 dev-mode 对齐，核心额度/限制类逻辑共用。
dev-mode = []

[lib]
name = "maclean_core"
path = "src/lib.rs"
