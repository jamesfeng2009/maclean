[package]
name = "maclean-free"
version = "0.2.0"
edition = "2021"
description = "maclean Free 桌面应用（egui 壳 + CLI）—— Open Core 公开产品"
license = "Apache-2.0"
repository = "https://github.com/jamesfeng2009/maclean"

# Open Core 公开产品（strategy §3.1 apps/maclean-free）。
# 本包 = egui 壳 + CLI 分发入口；核心逻辑在 maclean-core，
# 公开契约在 maclean-types。egui 壳与未来的 Tauri 壳都只依赖 core，
# 删除安全闸门只有一份实现。
#
# 注意：本包从仓库根移动而来（原根包 `maclean`，2026-10-07 Open Core 拆分）。
# bin 名为 `maclean`（Phase 8 后 maclean-keygen 移入私有 Pro 仓库，见 strategy §17）。

[dependencies]
maclean-core = { path = "../../crates/maclean-core", version = "0.2.0" }
maclean-types = { path = "../../crates/maclean-types", version = "0.2.0" }
maclean-cli = { path = "../../crates/maclean-cli", version = "0.2.0" }
# GUI 层：默认启用。`--no-default-features` 构建出纯 CLI 二进制
# （服务器 / CI / 容器场景，不链接任何窗口系统依赖）。
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }
dirs = "5.0"
tray-icon = { version = "0.14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = "2"
# CLI: Ctrl+C 优雅取消（进度中断时以退出码 7 结束）

[build-dependencies]
# 把 .ico / manifest 编进 Windows exe。选它而不是 winres，是因为它支持
# 从 macOS 交叉编译到 Windows（winres 只能在 Windows 宿主上跑）。
# 找不到资源编译器时的行为见 build.rs 里的说明。
embed-resource = "2"

[features]
default = []
# GUI 壳（egui/eframe + 菜单栏）。裁剪掉后得到纯 CLI 二进制：
#   cargo build --release --no-default-features
# 核心能力（扫描 / 删除闸门 / 备份 / 启动项 / 优化 / 调度 / 提权）全部保留。
gui = ["dep:eframe", "dep:egui", "dep:tray-icon"]

# 开发模式：跳过全部 License / 额度限制，仅用于本地开发调试。
#
# !! 发布构建（scripts/build-package.sh、CI、Homebrew）一律不得启用此 feature !!
# 启用后打出的包任何人都能免费用完整功能。
dev-mode = []

[[bin]]
name = "maclean"
path = "src/main.rs"
