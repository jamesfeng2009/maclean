[package]
name = "maclean"
version = "0.2.0"
edition = "2021"
description = "macOS 磁盘清理 GUI 工具 - 专注开发者缓存与深度清理"

# UI 改造阶段 0（2026-10）：核心逻辑抽到独立 crate `maclean-core`
# （ops / safety / scanner / scheduler 及其支撑模块），egui 壳与未来的
# Tauri 壳都只依赖 core，删除安全闸门只有一份实现。
[workspace]
resolver = "2"
members = ["crates/maclean-core"]

[dependencies]
maclean-core = { path = "crates/maclean-core", version = "0.2.0" }
# GUI 层：默认启用。`--no-default-features` 构建出纯 CLI 二进制
# （服务器 / CI / 容器场景，不链接任何窗口系统依赖）。
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }
walkdir = "2.5"
rayon = "1.10"
dirs = "5.0"
libc = "0.2"
tray-icon = { version = "0.14", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
sha2 = "0.10"
# CLI: Ctrl+C 优雅取消（进度中断时以退出码 7 结束）
ctrlc = "3"

[build-dependencies]
# 把 .ico / manifest 编进 Windows exe。选它而不是 winres，是因为它支持
# 从 macOS 交叉编译到 Windows（winres 只能在 Windows 宿主上跑）。
# 找不到资源编译器时的行为见 build.rs 里的说明。
embed-resource = "2"

[features]
default = ["gui"]
# GUI 壳（egui/eframe + 菜单栏）。裁剪掉后得到纯 CLI 二进制：
#   cargo build --release --no-default-features
# 核心能力（扫描 / 删除闸门 / 备份 / 启动项 / 优化 / 调度 / 提权）全部保留。
gui = ["dep:eframe", "dep:egui", "dep:tray-icon"]

# 开发模式：跳过全部 License / 额度限制，仅用于本地开发调试。
#
# !! 发布构建（scripts/build-package.sh、CI、Homebrew）一律不得启用此 feature !!
# 启用后打出的包任何人都能免费用完整功能。
dev-mode = []

[[bin]]
name = "maclean"
path = "src/main.rs"

[[bin]]
name = "maclean-keygen"
path = "src/bin/keygen.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
