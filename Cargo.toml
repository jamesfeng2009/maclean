[package]
name = "maclean"
version = "0.2.0"
edition = "2021"
description = "macOS 磁盘清理 GUI 工具 - 专注开发者缓存与深度清理"

[dependencies]
eframe = "0.29"
egui = "0.29"
walkdir = "2.5"
rayon = "1.10"
dirs = "5.0"
libc = "0.2"
tray-icon = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
