# maclean Open Core 公开仓库 · 虚拟 workspace（2026-10-07 拆分）
#
# 拓扑（strategy §3.1 / §7.1 + split 02_CARGO_WORKSPACE_SPLIT.md）：
#
#   crates/maclean-types    公开契约层（零私有依赖，最底层）
#   crates/maclean-core     核心引擎（scanner / safety / ops / scheduler）
#   crates/maclean-storage  本地持久化（JSON-first 存储 + 迁移框架）
#   crates/maclean-platform 平台适配器契约（Trash / 路径 / 注册表）
#   crates/maclean-cli      CLI 契约（命令解析 / envelope / 渲染）
#   apps/maclean-free       公开产品（egui 壳 + CLI 入口，产物名 maclean）
#   tauri/src-tauri         Tauri 壳（maclean-tauri）
#
# 规则：
# - 公开 workspace 必须独立编译（不依赖任何私有仓库/密钥）；
# - `cargo build --workspace` / `cargo test --workspace` 可无私有访问完成；
# - 默认构建 apps/maclean-free（default-members），产物名保持 `maclean`。

[workspace]
resolver = "3"
members = [
    "crates/maclean-types",
    "crates/maclean-core",
    "crates/maclean-storage",
    "crates/maclean-platform",
    "crates/maclean-cli",
    "apps/maclean-free",
    "tauri/src-tauri",
]
default-members = ["apps/maclean-free"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jamesfeng2009/maclean"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2.5"
rayon = "1.10"
dirs = "5.0"
libc = "0.2"

# 发布优化（workspace 模式下 [profile.release] 必须在根声明，子包声明会被忽略）
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
