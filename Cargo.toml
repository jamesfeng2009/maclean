[package]
name = "maclean"
version = "0.2.0"
edition = "2021"
description = "macOS 磁盘清理 GUI 工具 - 专注开发者缓存与深度清理"

[dependencies]
eframe = "0.29"
egui = "0.29"
walkdir = "2.5"
rayon = "1.10"
dirs = "5.0"
libc = "0.2"
tray-icon = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
sha2 = "0.10"

[features]
# 开发模式：跳过全部 License / 额度限制，仅用于本地开发调试。
#
# !! 发布构建（scripts/build-package.sh、CI、Homebrew）一律不得启用此 feature !!
# 启用后打出的包任何人都能免费用完整功能。
dev-mode = []

[[bin]]
name = "maclean"
path = "src/main.rs"

[[bin]]
name = "maclean-keygen"
path = "src/bin/keygen.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
