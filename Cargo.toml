# maclean 公开仓库 · 虚拟 workspace（2026-10-13 商业化边界调整）
#
# 产品分层（DECISION BASELINE 2026-10-13）：
#   - maclean CLI（apps/maclean-cli）：永久免费 · Apache-2.0 开源，
#     本仓库的唯一发行产物。
#   - maclean App（GUI）：14 天完整试用，试用后付费解锁；
#     位于私有 maclean-pro 仓库，不在本公开仓库构建/分发。
#
# 拓扑：
#
#   crates/maclean-types    公开契约层（零私有依赖，最底层）
#   crates/maclean-core     核心引擎（scanner / safety / ops / scheduler）
#   crates/maclean-storage  本地持久化（JSON-first 存储 + 迁移框架）
#   crates/maclean-platform 平台适配器契约（Trash / 路径 / 注册表）
#   crates/maclean-cli      CLI 契约（命令解析 / envelope / 渲染）
#   apps/maclean-cli        公开产品（纯 CLI 二进制，产物名 maclean）
#
# 规则（MAC-CLI-001/004）：
# - 公开 workspace 必须独立编译（不依赖任何私有仓库/密钥/GUI）；
# - `cargo build --workspace` / `cargo test --workspace` 可无私有访问完成；
# - 默认构建 apps/maclean-cli（default-members），产物名保持 `maclean`；
# - CLI 不含 license / trial / 授权服务器逻辑，不因试用或付款失败失效。
#
# 历史备注：apps/maclean-free（egui 壳）与 tauri/（Tauri 壳）已于
# 2026-10-13 迁出公开仓库，移入 maclean-production-v1.0/pro-app/ 作为
# 私有 maclean-pro 仓库的种子（见 docs/governance/LICENSE_BOUNDARY.md）。

[workspace]
resolver = "3"
members = [
    "crates/maclean-types",
    "crates/maclean-core",
    "crates/maclean-storage",
    "crates/maclean-platform",
    "crates/maclean-cli",
    "apps/maclean-cli",
]
# 私有包目录不属于公开 workspace（独立 workspace 见各目录内 Cargo.toml）
exclude = [
    "maclean-license-server-v1.0",
    "maclean-production-v1.0",
]
default-members = ["apps/maclean-cli"]

[workspace.package]
# 单一版本事实来源（2026-10-27 统一）：
# 所有 workspace 成员写 `version.workspace = true`，此处 bump 一次即全量生效。
#
# 历史问题：本字段长期停在 0.2.0，而 apps/maclean-cli 随每次 release 单独
# bump（0.3.x → 0.4.x），crates/ 下的库 crate 又分别停在 0.2.0/0.2.2/0.2.3。
# 结果是 `maclean --version` 报的版本、homebrew formula 拉的 tag、issue 里
# 用户贴的版本号三者对不上。
#
# 0.4.1 = 上一个已发行版本（git tag v0.4.1）。
# 0.4.2 = 本次修复版本：--tab 收紧为枚举、workspace 版本号对齐、
#         Windows 目标编译修复。patch 级，无功能新增。
version = "0.4.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jamesfeng2009/maclean"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2.5"
rayon = "1.10"
dirs = "5.0"
libc = "0.2"

# ---- 内部 crate（path + version 双写，缺一不可）----
#
# path：工作区内始终编译本地源码，不依赖 registry 上的旧版本。
# version：`cargo publish` 的硬性要求 —— 内部依赖只有 path 没有 version 时，
#   发布直接失败：
#     error: all dependencies must have a version specified when publishing.
#   0.4.2 之前这几个 crate 是手写在各自 [dependencies] 里的，彼此漂移；
#   bump 版本时要改 4 个文件，漏一个就发不出去。
#
# 现在收敛到这里：bump 只需改 [workspace.package] 和本节（scripts/bump-version.sh
# 一次改完，CI 里 version-consistency 会校验两处必须相等）。
maclean-types = { path = "crates/maclean-types", version = "0.4.2" }
maclean-core = { path = "crates/maclean-core", version = "0.4.2" }
maclean-cli-contract = { path = "crates/maclean-cli", version = "0.4.2" }

# 发布优化（workspace 模式下 [profile.release] 必须在根声明，子包声明会被忽略）
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
