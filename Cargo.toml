[package]
name = "maclean"
version = "0.1.0"
edition = "2021"
description = "macOS 磁盘清理 TUI 工具 - 专注开发者缓存与深度清理"

[dependencies]
ratatui = { version = "0.28", features = ["crossterm"] }
crossterm = "0.28"
walkdir = "2.5"
rayon = "1.10"
sysinfo = "0.32"
dirs = "5.0"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
